<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Inference - Запросы к базе знаний</title>
    <link rel="stylesheet" href="static/css/rag_inference.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG Inference</h1>
            <p>Задавайте вопросы к вашей базе знаний</p>
        </div>

        <div class="content">
            <!-- Sidebar with settings -->
            <div class="sidebar">
                <div class="section">
                    <h2>📦 Выбор пайплайна</h2>
                    <label>Пайплайн</label>
                    <select id="pipelineSelect" onchange="loadPipelineInfo()">
                        <option value="">Загрузка...</option>
                    </select>
                    <div id="pipelineInfo" class="info-box" style="display: none;">
                        <strong>Vector DB:</strong> <span id="vectorDbId">-</span><br>
                        <strong>Files:</strong> <span id="filesCount">-</span><br>
                        <strong>Chunks:</strong> <span id="chunksCount">-</span>
                    </div>
                </div>

                <div class="section">
                    <h2>🧠 LLM Модель</h2>
                    <label>Провайдер</label>
                    <select id="llmProvider" onchange="updateModelOptions()">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="custom">Custom API</option>
                    </select>

                    <label style="margin-top: 15px;">Модель</label>
                    <select id="llmModel">
                        <option value="gpt-4o">gpt-4o</option>
                    </select>

                    <div id="customApiUrl" style="display: none; margin-top: 15px;">
                        <label>API URL</label>
                        <input type="text" id="customUrl" placeholder="http://192.168.1.155:1234/v1">

                        <label style="margin-top: 15px;">Идентификатор модели</label>
                        <input type="text" id="customModelId" placeholder="qwen/qwen3-1.7b">
                        <div style="font-size: 0.85em; color: #666; margin-top: 5px;">
                            💡 Для LM Studio укажите точный ID модели (например: qwen/qwen3-1.7b)
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>⚙️ Параметры RAG</h2>
                    <div class="param-group">
                        <div>
                            <label>Top K документов</label>
                            <input type="number" id="topK" value="5" min="1" max="20">
                        </div>
                        <div>
                            <label>Temperature</label>
                            <input type="number" id="temperature" value="0" min="0" max="2" step="0.1">
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>📊 Статус</h2>
                    <div style="margin-bottom: 10px;">
                        <strong>Пайплайн:</strong>
                        <span id="pipelineStatus" class="status-badge status-ready">Не выбран</span>
                    </div>
                    <div>
                        <strong>LLM:</strong>
                        <span id="llmStatus" class="status-badge status-ready">Готов</span>
                    </div>
                </div>
            </div>

            <!-- Main query area -->
            <div class="main-area">
                <div class="query-input-area">
                    <label style="font-size: 1.1em; margin-bottom: 10px;">💬 Ваш вопрос:</label>
                    <textarea id="queryInput" class="query-input"
                        placeholder="Например: Какие типы усилителей используются для измерения биопотенциалов?"></textarea>
                    <button id="askButton" onclick="askQuestion()" style="margin-top: 10px;">
                        Задать вопрос
                    </button>
                </div>

                <div class="response-area" id="responseArea">
                    <div class="empty-state">
                        <div class="empty-state-icon">💭</div>
                        <p>Выберите пайплайн и задайте вопрос</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/rag_inference.js"></script>
</body>

</html>
